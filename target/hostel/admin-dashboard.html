<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | HostelHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8fc;
            min-height: 100vh;
        }

        /* Navigation */

        .navbar {
            background: #1e3a5f;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .logo span {
            color: #2196f3;
        }

        .admin-name {
            font-size: 15px;
        }

        .logout {
            background: #e53935;
            color: white;

            text-decoration: none;

            padding: 9px 18px;

            border-radius: 6px;

            margin-left: 15px;
        }

        /* Main */

        .container {
            width: 90%;
            max-width: 1100px;

            margin: 40px auto;
        }

        h1 {
            color: #1e3a5f;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        /* Statistics */

        .stats {
            display: flex;

            gap: 20px;

            flex-wrap: wrap;

            margin-bottom: 30px;
        }

        .stat-card {
            background: white;

            flex: 1;

            min-width: 200px;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.10);
        }

        .stat-card h3 {
            color: #666;

            font-size: 15px;

            margin-bottom: 12px;
        }

        .number {
            font-size: 30px;

            font-weight: bold;

            color: #2196f3;
        }

        /* Requests */

        .requests {
            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.10);
        }

        .requests h2 {
            color: #1e3a5f;

            margin-bottom: 20px;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;

            text-align: left;

            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f1f5f9;

            color: #1e3a5f;
        }

        td {
            color: #555;
        }

        .pending {
            color: #ff9800;

            font-weight: bold;
        }

        .approve {
            background: #4caf50;

            color: white;

            border: none;

            padding: 8px 14px;

            border-radius: 5px;

            cursor: pointer;
        }

        .reject {
            background: #e53935;

            color: white;

            border: none;

            padding: 8px 14px;

            border-radius: 5px;

            cursor: pointer;

            margin-left: 5px;
        }

        /* Responsive */

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;
            }

            .container {
                width: 95%;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }

        }

    </style>

</head>


<body>


    <!-- Navigation Bar -->

    <div class="navbar">

        <div class="logo">
            Hostel<span>Hub</span>
        </div>

        <div class="admin-name">

            Admin

            <a href="login.html"
               class="logout">

                Logout

            </a>

        </div>

    </div>


    <!-- Main Container -->

    <div class="container">

        <h1>
            Admin Dashboard
        </h1>

        <p class="subtitle">
            Manage students, rooms and hostel allocation requests.
        </p>


        <!-- Statistics -->

        <div class="stats">


            <div class="stat-card">

                <h3>
                    Total Students
                </h3>

                <div class="number">
                    1
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Available Rooms
                </h3>

                <div class="number">
                    10
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Pending Requests
                </h3>

                <div class="number">
                    1
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Allocated Rooms
                </h3>

                <div class="number">
                    0
                </div>

            </div>


        </div>


        <!-- Allocation Requests -->

        <div class="requests">

            <h2>
                Room Allocation Requests
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            Student ID
                        </th>

                        <th>
                            Student Name
                        </th>

                        <th>
                            Room Type
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody>

                    <tr>

                        <td>
                            STU001
                        </td>

                        <td>
                            Student Name
                        </td>

                        <td>
                            Any
                        </td>

                        <td class="pending">
                            Pending
                        </td>

                        <td>

                           <form action="ApproveServlet" method="post" style="display:inline;">

    <input type="hidden"
           name="studentId"
           value="STU001">

    <button type="submit" class="approve">
        Approve
    </button>

</form> 

                            <button class="reject">
                                Reject
                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


</body>

</html>
