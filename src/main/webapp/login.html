<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | HostelHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #eaf6ff, #ffffff);
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #1e3a5f;
            margin-bottom: 10px;
        }

        .logo span {
            color: #2196f3;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .role-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .role-buttons button {
            flex: 1;
            padding: 11px;
            border: 1px solid #2196f3;
            border-radius: 6px;
            background: white;
            color: #2196f3;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .role-buttons button.active {
            background: #2196f3;
            color: white;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2196f3;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #2196f3;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #1769aa;
        }

        .forgot-password {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 15px;
        }

        .forgot-password a {
            color: #2196f3;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register a {
            color: #2196f3;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            Hostel<span>Hub</span>
        </div>

        <h2 id="loginTitle">Student Login</h2>

        <p class="subtitle" id="loginSubtitle">
            Login to access your hostel account
        </p>

        <!-- Student / Admin selection -->
     

        <form id="loginForm"
              action="LoginServlet"
              method="post">

            <label id="idLabel" for="loginId">
                Student ID
            </label>

            <input
                type="text"
                id="loginId"
                name="studentId"
                placeholder="Enter your Student ID"
                autocomplete="off"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <!-- Student only -->
            <div class="forgot-password" id="forgotPassword">
                <a href="forgot-password.html">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="login-btn" id="loginButton">
                Student Login
            </button>

        </form>

        <!-- Student only -->
        <div class="register" id="registerSection">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>

        <div class="back">

            <a href="homepage.html">
                ← Back to Home
            </a>

        </div>

    </div>


   

</body>

</html>
