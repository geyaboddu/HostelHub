<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Allocation | HostelHub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        #selectedRoom {
            display: none;
            padding: 10px;
            margin-top: 6px;
            background: #f1f1f1;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Room Allocation Request</h2>

    <form action="./AllocationServlet" method="post">

        <!-- Student ID -->

            name="studentId"
            required
        >


        <!-- Room selected from Rooms page -->
        <div id="selectedRoom"></div>


        <!-- Hidden Room ID -->

            type="hidden"
            id="hiddenRoomId"
            name="roomId"
        >


        <!-- Floor Selection -->
        <div id="floorSelection">

            <select
                id="floorSelect"
                onchange="filterRooms()"
            >

                <option value="ground">Ground Floor</option>
                <option value="first">1st Floor</option>

                    data-occupied="0">
                    G06
                </option>

                <option
                    value="17"

                    data-capacity="4"
                    data-occupied="0">
                    G07
                </option>

                <option
                    value="18"
                    data-floor="ground"
                    data-capacity="5"
                    data-occupied="0">
                    G08
                </option>

                <option
                    value="19"
                    data-floor="ground"
                    data-capacity="5"
                    data-occupied="0">
                    G09
                </option>

                <option
                    value="20"
                    data-floor="ground"
                    data-capacity="5"
                    data-occupied="0">
                    G10
                </option>


                <!-- 1st Floor -->

                <option
                    value="1"
                    data-floor="first"
                    data-capacity="2"
                    data-occupied="0">
                    101
                </option>

                <option
                    value="2"
                    data-floor="first"
                    data-capacity="2"
                    data-occupied="0">
                    102
                </option>

                <option
                    value="3"
                    data-floor="first"
                    data-capacity="2"
                    data-occupied="0">
                    103
                </option>

                <option
                    value="24"
                    data-floor="first"
                    data-capacity="4"

                <option

        <!-- Bed -->

        <label for="bedNumber">Select Bed</label>

        <select
            id="bedNumber"
            name="bedNumber"
            required
        >

            <option value="">Select Bed</option>

        </select>


        <!-- Reason -->

        <label for="reason">Reason</label>

        <textarea
            id="reason"
            name="reason"
            placeholder="Enter reason for room allocation"
            required
        ></textarea>


        <!-- Submit -->

        <button type="submit">
            Submit Request
        </button>

    </form>

</div>


<script>

/*
 * Page Load
 */

window.onload = function () {

    const params =
        new URLSearchParams(window.location.search);

    const roomId =
        params.get("roomId");

    const roomNumber =
        params.get("roomNumber");

    const capacity =
        params.get("capacity");

    const occupied =
        params.get("occupied");


    /*
     * If user came from Rooms page
     */

    if (roomId) {

        document.getElementById("floorSelection")
            .style.display = "none";

        document.getElementById("roomSelection")
            .style.display = "none";


        document.getElementById("hiddenRoomId")
            .value = roomId;


        const selectedRoom =
            document.getElementById("selectedRoom");


        selectedRoom.style.display = "block";


        selectedRoom.innerHTML =
            "<strong>Selected Room:</strong> "
            + roomNumber;


        loadBedsFromURL(
            capacity,
            occupied
        );
    }

};


/*
 * Filter rooms according to selected floor
 */

function filterRooms() {

    const floor =
        document.getElementById("floorSelect").value;

    const roomSelect =
        document.getElementById("roomSelect");

    const options =
        roomSelect.querySelectorAll("option");


    roomSelect.value = "";

    document.getElementById("hiddenRoomId")
        .value = "";


    document.getElementById("bedNumber").innerHTML =
        '<option value="">Select Bed</option>';


    options.forEach(function(option) {

        if (option.value === "") {
            option.style.display = "block";
            return;
        }

        if (option.getAttribute("data-floor") === floor) {
            option.style.display = "block";
        } else {
            option.style.display = "none";
        }

    });

}


/*
 * Load beds when room is selected
 */

function loadBeds() {

    const roomSelect =
        document.getElementById("roomSelect");

    const selected =
        roomSelect.options[
            roomSelect.selectedIndex
        ];


    const roomId =
        roomSelect.value;


    const bedSelect =
        document.getElementById("bedNumber");


    bedSelect.innerHTML =
        '<option value="">Select Bed</option>';


    if (!roomId) {

        document.getElementById("hiddenRoomId")
            .value = "";

        return;
    }


    /*
     * Set hidden room ID
     */

    document.getElementById("hiddenRoomId")
        .value = roomId;


    const capacity =
        parseInt(
            selected.getAttribute("data-capacity")
        );


    const occupied =
        parseInt(
            selected.getAttribute("data-occupied")
        );


    /*
     * Check available beds
     */

    if (occupied >= capacity) {

        bedSelect.innerHTML =
            '<option value="">No beds available</option>';

        return;
    }


    /*
     * Generate available beds
     */

    for (
        let i = occupied + 1;
        i <= capacity;
        i++
    ) {

        const option =
            document.createElement("option");

        option.value = i;

        option.textContent =
            "Bed " + i;

        bedSelect.appendChild(option);
    }

}


/*
 * Load beds when coming from Rooms page
 */

function loadBedsFromURL(
    capacity,
    occupied
) {

    const bedSelect =
        document.getElementById("bedNumber");


    bedSelect.innerHTML =
        '<option value="">Select Bed</option>';


    capacity =
        parseInt(capacity);


    occupied =
        parseInt(occupied);


    if (occupied >= capacity) {

        bedSelect.innerHTML =
            '<option value="">No beds available</option>';

        return;
    }


    for (
        let i = occupied + 1;
        i <= capacity;
        i++
    ) {

        const option =
            document.createElement("option");


        option.value = i;

        option.textContent =
            "Bed " + i;


        bedSelect.appendChild(option);
    }

}

</script>

</body>

</html>
