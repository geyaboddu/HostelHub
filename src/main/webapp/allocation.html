<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Allocation | HostelHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 40px auto;
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 28px;
            font-size: 26px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #999;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            margin-top: 28px;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #087ff5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #066dcc;
        }

        .selected-room {
            display: none;
            background: #eef5ff;
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            color: #174a8b;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                margin: 0;
                min-height: 100vh;
                border-radius: 0;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Room Allocation Request</h1>

    <form action="AllocationServlet" method="post"
          onsubmit="return validateForm();">

        <!-- FLOOR -->

        <label for="floor">Select Floor</label>

        <select id="floor" onchange="loadRooms()">

            <option value="">Select Floor</option>

            <option value="ground">
                Ground Floor
            </option>

            <option value="first">
                1st Floor
            </option>

            <option value="second">
                2nd Floor
            </option>

        </select>


        <!-- ROOM -->

        <label for="room">Select Room</label>

        <select id="room"
                name="roomId"
                onchange="loadBeds()">

            <option value="">Select Room</option>

        </select>


        <!-- SELECTED ROOM -->

        <div id="selectedRoom"
             class="selected-room">
        </div>


        <!-- BED -->

        <label for="bedNumber">Select Bed</label>

        <select id="bedNumber"
                name="bedNumber"
                required>

            <option value="">Select Bed</option>

        </select>


        <!-- REASON -->

        <label for="reason">Reason</label>

        <textarea
            id="reason"
            name="reason"
            placeholder="Enter reason for room allocation"
            required></textarea>


        <!-- SUBMIT -->

        <button type="submit"
                class="submit-btn">
            Submit Request
        </button>

    </form>

</div>


<script>

    // =========================================================
    // ROOM DATA
    // =========================================================

    const rooms = {

        ground: [
            { id: 1,  number: "G01" },
            { id: 2,  number: "G02" },
            { id: 3,  number: "G03" },
            { id: 4,  number: "G04" },
            { id: 5,  number: "G05" },
            { id: 6,  number: "G06" },
            { id: 7,  number: "G07" },
            { id: 8,  number: "G08" },
            { id: 9,  number: "G09" },
            { id: 10, number: "G10" }
        ],

        first: [
            { id: 11, number: "101" },
            { id: 12, number: "102" },
            { id: 13, number: "103" },
            { id: 14, number: "104" },
            { id: 15, number: "105" },
            { id: 16, number: "106" },
            { id: 17, number: "107" },
            { id: 18, number: "108" },
            { id: 19, number: "109" },
            { id: 20, number: "110" }
        ],

        second: [
            { id: 21, number: "201" },
            { id: 22, number: "202" },
            { id: 23, number: "203" },
            { id: 24, number: "204" },
            { id: 25, number: "205" },
            { id: 26, number: "206" },
            { id: 27, number: "207" },
            { id: 28, number: "208" },
            { id: 29, number: "209" },
            { id: 30, number: "210" }
        ]

    };


    // =========================================================
    // LOAD ROOMS
    // =========================================================

    function loadRooms() {

        const floor =
            document.getElementById("floor").value;

        const room =
            document.getElementById("room");

        const bed =
            document.getElementById("bedNumber");

        const selectedRoom =
            document.getElementById("selectedRoom");


        room.innerHTML =
            '<option value="">Select Room</option>';

        bed.innerHTML =
            '<option value="">Select Bed</option>';

        selectedRoom.style.display = "none";


        if (!floor) {
            return;
        }


        rooms[floor].forEach(function(item) {

            const option =
                document.createElement("option");

            option.value = item.id;

            option.textContent =
                item.number;

            option.setAttribute(
                "data-room-number",
                item.number
            );

            room.appendChild(option);

        });

    }


    // =========================================================
    // LOAD BEDS FROM DATABASE
    // =========================================================

    function loadBeds() {

        const room =
            document.getElementById("room");

        const roomId =
            room.value;

        const bed =
            document.getElementById("bedNumber");

        const selectedRoom =
            document.getElementById("selectedRoom");


        bed.innerHTML =
            '<option value="">Loading beds...</option>';

        selectedRoom.style.display = "none";


        if (!roomId) {

            bed.innerHTML =
                '<option value="">Select Bed</option>';

            return;
        }


        const selectedOption =
            room.options[
                room.selectedIndex
            ];

        const roomNumber =
            selectedOption.getAttribute(
                "data-room-number"
            );


        selectedRoom.textContent =
            "Selected Room: " + roomNumber;

        selectedRoom.style.display =
            "block";


        loadBedsFromDatabase(roomId);

    }


    // =========================================================
    // GET AVAILABLE BEDS
    // =========================================================

    function loadBedsFromDatabase(roomId) {

        const bedSelect =
            document.getElementById("bedNumber");


        bedSelect.innerHTML =
            '<option value="">Loading beds...</option>';


        fetch(
            "AllocationServlet?roomId="
            + encodeURIComponent(roomId)
        )

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Server error"
                );
            }

            return response.json();

        })

        .then(function(data) {

            bedSelect.innerHTML =
                '<option value="">Select Bed</option>';


            if (data.error) {

                bedSelect.innerHTML =
                    '<option value="">'
                    + data.error
                    + '</option>';

                return;
            }


            const capacity =
                parseInt(data.capacity);


            const occupiedBeds =
                data.occupiedBeds || [];


            if (occupiedBeds.length >= capacity) {

                bedSelect.innerHTML =
                    '<option value="">No beds available</option>';

                return;
            }


            for (
                let i = 1;
                i <= capacity;
                i++
            ) {

                if (
                    occupiedBeds.includes(i)
                ) {
                    continue;
                }


                const option =
                    document.createElement("option");


                option.value = i;

                option.textContent =
                    "Bed " + i;


                bedSelect.appendChild(option);
            }

        })

        .catch(function(error) {

            console.error(
                "Bed loading error:",
                error
            );


            bedSelect.innerHTML =
                '<option value="">'
                + "Unable to load beds"
                + '</option>';

        });

    }


    // =========================================================
    // FORM VALIDATION
    // =========================================================

    function validateForm() {

        const floor =
            document.getElementById("floor").value;

        const room =
            document.getElementById("room").value;

        const bed =
            document.getElementById("bedNumber").value;

        const reason =
            document.getElementById("reason").value.trim();


        if (!floor) {

            alert(
                "Please select a floor."
            );

            return false;
        }


        if (!room) {

            alert(
                "Please select a room."
            );

            return false;
        }


        if (!bed) {

            alert(
                "Please select a bed."
            );

            return false;
        }


        if (!reason) {

            alert(
                "Please enter a reason."
            );

            return false;
        }


        return true;
    }


    // =========================================================
    // DIRECT URL WITH ROOM ID SUPPORT
    // Example:
    // allocation.html?roomId=1&roomNumber=G01
    // =========================================================

    window.onload = function() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const roomId =
            params.get("roomId");

        const roomNumber =
            params.get("roomNumber");


        if (roomId) {

            const floor =
                document.getElementById("floor");

            const room =
                document.getElementById("room");

            const selectedRoom =
                document.getElementById(
                    "selectedRoom"
                );


            // Hide floor selection
            floor.parentElement.style.display =
                "none";


            room.innerHTML =
                '<option value="'
                + roomId
                + '">'
                + (roomNumber || "Selected Room")
                + '</option>';


            room.value =
                roomId;


            selectedRoom.textContent =
                "Selected Room: "
                + (roomNumber || roomId);


            selectedRoom.style.display =
                "block";


            loadBedsFromDatabase(roomId);
        }

    };

</script>

</body>
</html>
