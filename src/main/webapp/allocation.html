<!DOCTYPE html>
<html>
<head>
    <title>Room Allocation | HostelHub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #selectedRoom {
            display: none;
            padding: 10px;
            margin-top: 6px;
            background: #f1f1f1;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Room Allocation Request</h2>

    <form action="AllocationServlet" method="post">

        <label>Student ID</label>
        <input type="text" name="studentId" required>

        <!-- Room dropdown for Dashboard flow -->
        <div id="roomSelection">

            <label>Select Room</label>

            <select id="roomId" name="roomId" onchange="loadBeds()" required>

                <option value="">Select Room</option>

                <option value="1"
                        data-room="101"
                        data-capacity="2"
                        data-occupied="2">
                    101
                </option>

                <option value="2"
                        data-room="102"
                        data-capacity="2"
                        data-occupied="0">
                    102
                </option>

                <option value="3"
                        data-room="103"
                        data-capacity="3"
                        data-occupied="0">
                    103
                </option>

                <option value="4"
                        data-room="201"
                        data-capacity="4"
                        data-occupied="0">
                    201
                </option>

                <option value="5"
                        data-room="202"
                        data-capacity="5"
                        data-occupied="0">
                    202
                </option>

            </select>

        </div>

        <!-- Automatically selected room -->
        <div id="selectedRoom"></div>

        <!-- Hidden room ID sent to servlet -->
        <input type="hidden" id="hiddenRoomId" name="roomId">

        <label>Select Bed</label>

        <select id="bedNumber" name="bedNumber" required>

            <option value="">Select Bed</option>

        </select>

        <label>Reason</label>

        <textarea name="reason"
                  placeholder="Enter reason for room allocation"
                  required></textarea>

        <button type="submit">
            Submit Request
        </button>

    </form>

</div>


<script>

window.onload = function () {

    const params = new URLSearchParams(window.location.search);

    const roomId = params.get("roomId");
    const roomNumber = params.get("roomNumber");
    const capacity = params.get("capacity");
    const occupied = params.get("occupied");

    /*
     * If user came from Available Rooms page
     */
    if (roomId) {

        // Hide room dropdown
        document.getElementById("roomSelection").style.display = "none";

        // Show selected room
        const selectedRoom = document.getElementById("selectedRoom");

        selectedRoom.style.display = "block";

        selectedRoom.innerHTML =
            "<strong>Selected Room:</strong> " + roomNumber;

        // Send room ID to servlet
        document.getElementById("hiddenRoomId").value = roomId;

        // Load available beds
        loadBedsFromURL(capacity, occupied);
    }

};


/*
 * Load beds when room comes from Available Rooms page
 */
function loadBedsFromURL(capacity, occupied) {

    const bedSelect = document.getElementById("bedNumber");

    bedSelect.innerHTML =
        '<option value="">Select Bed</option>';

    capacity = parseInt(capacity);
    occupied = parseInt(occupied);

    if (occupied >= capacity) {

        bedSelect.innerHTML =
            '<option value="">No beds available</option>';

        return;
    }

    for (let i = occupied + 1; i <= capacity; i++) {

        const option = document.createElement("option");

        option.value = i;
        option.textContent = "Bed " + i;

        bedSelect.appendChild(option);
    }
}


/*
 * Load beds when user selects room manually
 * from Student Dashboard
 */
function loadBeds() {

    const roomSelect = document.getElementById("roomId");

    const selected =
        roomSelect.options[roomSelect.selectedIndex];

    const bedSelect =
        document.getElementById("bedNumber");

    bedSelect.innerHTML =
        '<option value="">Select Bed</option>';

    if (!roomSelect.value) {
        return;
    }

    // Keep hidden room ID synchronized
    document.getElementById("hiddenRoomId").value =
        roomSelect.value;

    const capacity =
        parseInt(selected.getAttribute("data-capacity"));

    const occupied =
        parseInt(selected.getAttribute("data-occupied"));

    if (occupied >= capacity) {

        bedSelect.innerHTML =
            '<option value="">No beds available</option>';

        return;
    }

    for (let i = occupied + 1; i <= capacity; i++) {

        const option =
            document.createElement("option");

        option.value = i;
        option.textContent = "Bed " + i;

        bedSelect.appendChild(option);
    }
}

</script>

</body>
</html>
