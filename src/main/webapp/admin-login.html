<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | HostelHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(to right, #eaf6ff, #ffffff);
        }

        .container {
            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #1e3a5f;

            margin-bottom: 10px;
        }

        .logo span {
            color: #2196f3;
        }

        h2 {
            text-align: center;

            color: #333;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 14px;
        }

        input:focus {
            outline: none;

            border-color: #2196f3;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #1e3a5f;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #142a45;
        }

        .back {
            text-align: center;

            margin-top: 20px;
        }

        .back a {
            text-decoration: none;

            color: #2196f3;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            Hostel<span>Hub</span>
        </div>

        <h2>Admin Login</h2>

        <p class="subtitle">
            Login to manage hostel allocation
        </p>

        <form action="AdminLoginServlet" method="post">

            <label for="adminId">
                Admin ID
            </label>

            <input
                type="text"
                id="adminId"
                name="adminId"
                placeholder="Enter Admin ID"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Admin Login
            </button>

        </form>

        <div class="back">

            <a href="homepage.html">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
