<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Allocation Requests | HostelHub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8fc;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1e3a5f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2196f3;
            color: white;
        }

        .approve {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .reject {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
            color: #2196f3;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Hostel Allocation Requests</h1>

        <table>

            <tr>
                <th>Allocation ID</th>
                <th>Student ID</th>
                <th>Room ID</th>
                <th>Reason</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            <!-- Requests will appear here -->

            <tr>
                <td colspan="6">
                    Requests will be loaded here
                </td>
            </tr>

        </table>

        <a class="back" href="admin-dashboard.html">
            ← Back to Admin Dashboard
        </a>

    </div>

</body>

</html>saved
